<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e4a6d">
  <title>Theo’s Learning</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="../kit/a11y.css">
  <link rel="stylesheet" href="../kit/nav.css">
  <style>
    #home-root { padding: 16px; font-family: ui-sans-serif, system-ui, sans-serif; color: #161616; }
    .hs-home-head h1 { margin: 0 0 4px; font-size: 2rem; }
    .hs-home-head p { margin: 0 0 16px; }
    .hs-app-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .hs-app-card {
      display: flex; flex-direction: column; gap: 4px;
      min-height: 72px; padding: 16px; border: 2px solid #161616;
      background: #fff; color: inherit; text-decoration: none; font-weight: 700;
    }
    .hs-app-card span { font-weight: 500; font-size: 0.9rem; }
    .hs-settings { margin-top: 28px; }
    .hs-settings select, .hs-settings button, .hs-settings label {
      font: inherit; min-height: 56px;
    }
    .hs-settings select, .hs-settings button {
      border: 2px solid #161616; background: #fff; padding: 8px 12px;
    }
    .hs-settings-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .hs-empty { padding: 16px; border: 2px solid #161616; background: #fff; }
  </style>
</head>
<body class="hs-home">
  <div id="hs-chrome" class="hs-chrome"></div>
  <main id="home-root"></main>
  <script src="../kit/progress.js"></script>
  <script src="../kit/audio.js"></script>
  <script src="../kit/tts.js"></script>
  <script src="../kit/pwa.js"></script>
  <script src="../kit/nav.js"></script>
  <script src="../kit/home.js"></script>
</body>
</html>
